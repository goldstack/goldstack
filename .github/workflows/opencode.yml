name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    # The mention must be at the start of the comment. A substring match would also
    # match the agent's own share footer (`https://opencode.ai/s/...` contains
    # `/opencode`), letting each reply re-trigger this workflow in a loop.
    if: |
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      (github.event.comment.user.login == 'mxro' ||
       github.event.comment.user.login == 'goldstack')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "66645074+goldstack@users.noreply.github.com"
          git config --global user.name "Goldstack Project Builder"

      - name: Setup OpenCode auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_API_KEY }}"}}' > ~/.local/share/opencode/auth.json

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-pro
          use_github_token: true
