name: Template Deployment for DEV

on: [push]

# Only runs that actually deploy join the shared `template-deployment` group;
# every other push gets a unique group so it does not queue behind deployments.
# The whole deployment run holds the group, which keeps all of its matrix sets
# together and prevents overlap with the other deployment workflows.
concurrency:
  group: ${{ (github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, 'trigger_template_deploy_dev')) && 'template-deployment' || format('template-deploy-skip-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: 'Deploy build set'
    strategy:
      # Deploy sets are serialised within a run as well: they share the DEV AWS
      # account and some of the same mutable infrastructure.
      max-parallel: 1
      fail-fast: false
      matrix:
        deploy-set:
          [
            'nextjs-bootstrap',
            'backend-go-gin',
            'backend-lambda-api',
            'backend-nodejs-express',
            'nextjs',
            'nextjs-tailwind',
            'no-infra',
            'email-send',
            's3',
            'static-website',
            'user-management',
            'dynamodb',
            'server-side-rendering',
            'hetzner-vps',
            'lambda-python-job',
            'lambda-node-trigger',
          ]
    # Ensure we trigger after MASTER
    if: ${{ contains(github.event.head_commit.message, 'trigger_template_deploy_dev') && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goldstack repo
        uses: actions/checkout@v3
      - uses: ./.github/actions/goldstack-setup
      - uses: actions/setup-java@v4 # used for local DynamoDB
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setting SSH key for Hetzner deployment
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run build set
        run: |
          cd workspaces/apps/packages/template-management-cli
          yarn cli deploy-set \
            --set ${{ matrix.deploy-set }} \
            --deployment dev \
            --repo goldstack-dev \
            --workDir tmp \
            --emailResultsTo false \
        env:
          AWS_USER_NAME: goldstack-dev
          GOLDSTACK_DEBUG: true
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_DEFAULT_REGION: us-west-2
          GITHUB_TOKEN: ${{secrets.BUILD_TOKEN}}
          HCLOUD_TOKEN: ${{secrets.HCLOUD_TOKEN}}
