name: maintenance

on:
  schedule:
    - cron: '41 19 * * 6'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task filename stem to run (e.g. "aws_sdk_should_be_latest_version"). Leave empty or use "all" to run every task. When a custom file with the same name exists, it overrides the goldstack one.'
        required: false
        type: string
        default: ''

jobs:
  discover-tasks:
    runs-on: ubuntu-latest
    outputs:
      goldstack-matrix: ${{ steps.discover.outputs.goldstack-matrix }}
      custom-matrix: ${{ steps.discover.outputs.custom-matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Override goldstack tasks with custom equivalents
        run: |
          set -euo pipefail
          shopt -s nullglob
          for custom_file in instructions/custom/maintenance/*.md; do
            base=$(basename "$custom_file")
            goldstack_file="instructions/goldstack/maintenance/$base"
            if [[ -f "$goldstack_file" ]]; then
              echo "Custom overrides goldstack: $base"
              rm "$goldstack_file"
            fi
          done

      - name: Build task matrices
        id: discover
        env:
          TASK_FILTER: ${{ github.event.inputs.task }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          build_matrix() {
            local dir="$1" filter="$2"
            if [[ ! -d "$dir" ]]; then
              echo '{"include":[]}'
              return
            fi
            local entries="[]"
            for f in "$dir"/*.md; do
              local name="${f##*/}"
              name="${name%.md}"
              if [[ -n "$filter" && "$filter" != "all" && "$name" != "$filter" ]]; then
                continue
              fi
              entries=$(jq --arg n "$name" '. + [{name: $n}]' <<<"$entries")
            done
            jq -c -n --argjson e "$entries" '{include: $e}'
          }
          goldstack_matrix=$(build_matrix instructions/goldstack/maintenance "$TASK_FILTER")
          custom_matrix=$(build_matrix instructions/custom/maintenance "$TASK_FILTER")
          {
            echo "goldstack-matrix<<EOF"; echo "$goldstack_matrix"; echo "EOF"
            echo "custom-matrix<<EOF";   echo "$custom_matrix";   echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Goldstack matrix: $goldstack_matrix"
          echo "Custom matrix: $custom_matrix"

  maintenance-goldstack:
    needs: discover-tasks
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      TASK_CONTEXT: goldstack
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tasks.outputs.goldstack-matrix) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup OpenCode auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_API_KEY }}"}}' > ~/.local/share/opencode/auth.json

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          model: opencode-go/deepseek-v4-pro
          prompt: |
            You are performing the maintenance task in ${{ env.TASK_CONTEXT }}: ${{ matrix.name }}

            1. Read instructions/${{ env.TASK_CONTEXT }}/maintenance/${{ matrix.name }}.md for specific task instructions.
            2. Follow instructions/patching.md for how to update dependencies and validate.
            3. Follow instructions/maintenance.md for workflow (commits, PR management, time limits).

            Branch name: maintenance/${{ env.TASK_CONTEXT }}/${{ matrix.name }}

  maintenance-custom:
    needs: discover-tasks
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      TASK_CONTEXT: custom
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tasks.outputs.custom-matrix) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup OpenCode auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_API_KEY }}"}}' > ~/.local/share/opencode/auth.json

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          model: opencode-go/deepseek-v4-pro
          prompt: |
            You are performing the maintenance task in ${{ env.TASK_CONTEXT }}: ${{ matrix.name }}

            1. Read instructions/${{ env.TASK_CONTEXT }}/maintenance/${{ matrix.name }}.md for specific task instructions.
            2. Follow instructions/patching.md for how to update dependencies and validate.
            3. Follow instructions/maintenance.md for workflow (commits, PR management, time limits).

            Branch name: maintenance/${{ env.TASK_CONTEXT }}/${{ matrix.name }}
