name: maintenance

on:
  schedule:
    - cron: '41 19 * * 6'
  workflow_dispatch:
    inputs:
      task:
        description: 'Substring filter; only maintenance tasks whose name contains this text will run. Leave empty or set to "all" to run all tasks.'
        required: false
        default: ''
        type: string

jobs:
  discover-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build task entries
        id: discover
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries="[]"
          for dir in instructions/custom/maintenance instructions/goldstack/maintenance; do
            ctx="${dir#instructions/}"
            ctx="${ctx%/maintenance}"
            for f in "$dir"/*.md; do
              name="${f##*/}"
              name="${name%.md}"
              if [[ "$ctx" == "goldstack" && -f "instructions/custom/maintenance/${name}.md" ]]; then
                continue
              fi
              entries=$(jq --arg c "$ctx" --arg n "$name" '. + [{context: $c, name: $n}]' <<<"$entries")
            done
          done
          {
            echo "entries<<EOF"
            echo "$entries"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Entries: $entries"

      - name: Filter tasks
        id: filter
        env:
          ENTRIES: ${{ steps.discover.outputs.entries }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [[ -z "$TASK" || "$TASK" == "all" ]]; then
            filtered="$ENTRIES"
          else
            filtered=$(jq --arg t "$TASK" '[.[] | select(.name | contains($t))]' <<<"$ENTRIES")
            if [[ "$(jq 'length' <<<"$filtered")" -eq 0 ]]; then
              echo "::error::No maintenance tasks match filter: $TASK"
              exit 1
            fi
          fi
          matrix=$(jq -c -n --argjson e "$filtered" '{include: $e}')
          {
            echo "matrix<<EOF"
            echo "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Matrix: $matrix"

  maintenance:
    needs: discover-tasks
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tasks.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup OpenCode auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_API_KEY }}"}}' > ~/.local/share/opencode/auth.json

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          model: opencode-go/deepseek-v4-pro
          prompt: |
            You are performing the maintenance task in ${{ matrix.context }}: ${{ matrix.name }}

            1. Read instructions/${{ matrix.context }}/maintenance/${{ matrix.name }}.md for specific task instructions.
            2. Follow instructions/goldstack/patching.md to update dependencies and validate.
            3. Follow instructions/goldstack/maintenance.md for committing, pushing, PR management, CI monitoring, and time limits.

            Branch name: maintenance/${{ matrix.context }}/${{ matrix.name }}
