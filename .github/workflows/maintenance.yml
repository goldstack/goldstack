name: maintenance

on:
  # schedule:
  #   - cron: '41 19 * * 0' 
  workflow_dispatch:
    inputs:
      task:
        description: 'Substring filter; only maintenance tasks whose name contains this text will run. Leave empty or set to "all" to run all tasks.'
        required: false
        default: ''
        type: string

jobs:
  discover-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build task entries
        id: discover
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries="[]"
          for dir in instructions/custom/maintenance instructions/goldstack/maintenance; do
            ctx="${dir#instructions/}"
            ctx="${ctx%/maintenance}"
            for f in "$dir"/*.md; do
              name="${f##*/}"
              name="${name%.md}"
              if [[ "$ctx" == "goldstack" && -f "instructions/custom/maintenance/${name}.md" ]]; then
                continue
              fi
              entries=$(jq --arg c "$ctx" --arg n "$name" '. + [{context: $c, name: $n}]' <<<"$entries")
            done
          done
          {
            echo "entries<<EOF"
            echo "$entries"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Entries: $entries"

      - name: Filter tasks
        id: filter
        env:
          ENTRIES: ${{ steps.discover.outputs.entries }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [[ -z "$TASK" || "$TASK" == "all" ]]; then
            filtered="$ENTRIES"
          else
            filtered=$(jq --arg t "$TASK" '[.[] | select(.name | contains($t))]' <<<"$ENTRIES")
            if [[ "$(jq 'length' <<<"$filtered")" -eq 0 ]]; then
              echo "::error::No maintenance tasks match filter: $TASK"
              exit 1
            fi
          fi
          matrix=$(jq -c -n --argjson e "$filtered" '{include: $e}')
          {
            echo "matrix<<EOF"
            echo "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Matrix: $matrix"

  maintenance:
    needs: discover-tasks
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tasks.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `max-parallel: 1` only serializes jobs within a single run. Without this,
    # two runs (e.g. a dispatch while a scheduled run is still going) can work on
    # the same branch and race each other into a non-fast-forward push.
    concurrency:
      group: maintenance-${{ matrix.context }}-${{ matrix.name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "66645074+goldstack@users.noreply.github.com"
          git config --global user.name "Goldstack Project Builder"
          # The agent's instructions require merging master into a branch rather
          # than rebasing it. Make an accidental `git pull` do the same.
          git config --global pull.rebase false

      - name: Setup OpenCode auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_API_KEY }}"}}' > ~/.local/share/opencode/auth.json

      # `continue-on-error` lets the recovery steps below run before the job is
      # failed. Without them a rejected push loses the whole run.
      - name: Run OpenCode
        id: opencode
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          model: opencode/space-bunny-free
          # Keep the session private: the footer then only links this run,
          # and the session is never published to opencode.ai.
          share: false
          use_github_token: true
          prompt: |
            You are performing the maintenance task in ${{ matrix.context }}: ${{ matrix.name }}

            1. Read instructions/${{ matrix.context }}/maintenance/${{ matrix.name }}.md for specific task instructions.
            2. For version-bump tasks, check instructions/goldstack/version-gating.md to determine if the update is due (skip if version was bumped < 60 days ago).
            3. Follow instructions/goldstack/patching.md to update dependencies and validate.
            4. Follow instructions/goldstack/maintenance.md for committing, pushing, PR management, CI monitoring, and time limits.

            Branch name: maintenance/${{ matrix.context }}/${{ matrix.name }}

      - name: Publish agent commits
        id: publish
        if: ${{ always() }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Deliberately no `git fetch` here. `origin/<branch>` is the remote tip as
        # captured when this run checked out, so pinning the lease to it means a
        # branch someone else moved during the run is left alone rather than
        # clobbered.
        run: |
          set -euo pipefail
          branch="$(git branch --show-current)"
          if [ -z "$branch" ] || [ "$branch" = "HEAD" ] || [ "$branch" = "$DEFAULT_BRANCH" ]; then
            echo "::notice::Checked out '$branch' is not an agent branch; nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote_ref="refs/remotes/origin/$branch"
          if ! git rev-parse --verify --quiet "$remote_ref" > /dev/null; then
            echo "::notice::origin/$branch is unknown; there is no push to recover."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote_tip="$(git rev-parse "$remote_ref")"
          ahead="$(git rev-list --count "$remote_ref..HEAD" 2>/dev/null || echo 0)"
          if [ "$ahead" = "0" ]; then
            echo "::notice::$remote_ref already contains HEAD; nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$remote_tip" HEAD; then
            echo "Fast-forwarding $branch by $ahead commit(s)..."
            mode="fast-forward"
            git push origin "HEAD:refs/heads/$branch"
          else
            echo "History was rewritten; republishing $branch with --force-with-lease..."
            mode="force-with-lease"
            git push --force-with-lease="refs/heads/$branch:$remote_tip" origin "HEAD:refs/heads/$branch"
          fi
          {
            echo "branch=$branch"
            echo "mode=$mode"
            echo "published=true"
          } >> "$GITHUB_OUTPUT"

      # Never start this body with `/oc` or `/opencode`: that would re-trigger the
      # opencode workflow. Keep the text first, the run link last.
      - name: Explain republished commits
        if: ${{ steps.publish.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          MODE: ${{ steps.publish.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NUMBER="$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty' || true)"
          if [ -z "$NUMBER" ]; then
            echo "::notice::No pull request to explain the republished commits on."
            exit 0
          fi
          gh issue comment "$NUMBER" --body "The agent run reported a rejected push (\`non-fast-forward\`). Its commits were published to \`$BRANCH\` afterwards using \`$MODE\`, so the branch now holds the agent's final state. Run log: $RUN_URL"

      - name: Fail the run if the agent failed
        if: ${{ steps.opencode.outcome == 'failure' }}
        run: |
          echo "::error::The opencode agent run failed. See the pull request for details."
          exit 1

