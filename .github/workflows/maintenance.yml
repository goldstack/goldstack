name: maintenance

on:
  # schedule:
  #   - cron: '41 19 * * 0' 
  workflow_dispatch:
    inputs:
      task:
        description: 'Substring filter; only maintenance tasks whose name contains this text will run. Leave empty or set to "all" to run all tasks.'
        required: false
        default: ''
        type: string

jobs:
  discover-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build task entries
        id: discover
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries="[]"
          for dir in instructions/custom/maintenance instructions/goldstack/maintenance; do
            ctx="${dir#instructions/}"
            ctx="${ctx%/maintenance}"
            for f in "$dir"/*.md; do
              name="${f##*/}"
              name="${name%.md}"
              if [[ "$ctx" == "goldstack" && -f "instructions/custom/maintenance/${name}.md" ]]; then
                continue
              fi
              entries=$(jq --arg c "$ctx" --arg n "$name" '. + [{context: $c, name: $n}]' <<<"$entries")
            done
          done
          {
            echo "entries<<EOF"
            echo "$entries"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Entries: $entries"

      - name: Filter tasks
        id: filter
        env:
          ENTRIES: ${{ steps.discover.outputs.entries }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [[ -z "$TASK" || "$TASK" == "all" ]]; then
            filtered="$ENTRIES"
          else
            filtered=$(jq --arg t "$TASK" '[.[] | select(.name | contains($t))]' <<<"$ENTRIES")
            if [[ "$(jq 'length' <<<"$filtered")" -eq 0 ]]; then
              echo "::error::No maintenance tasks match filter: $TASK"
              exit 1
            fi
          fi
          matrix=$(jq -c -n --argjson e "$filtered" '{include: $e}')
          {
            echo "matrix<<EOF"
            echo "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Matrix: $matrix"

  maintenance:
    needs: discover-tasks
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tasks.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `max-parallel: 1` only serializes jobs within a single run. Without this,
    # two runs (e.g. a dispatch while a scheduled run is still going) can work on
    # the same branch and race each other into a non-fast-forward push.
    concurrency:
      group: maintenance-${{ matrix.context }}-${{ matrix.name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "66645074+goldstack@users.noreply.github.com"
          git config --global user.name "Goldstack Project Builder"
          # The agent's instructions require merging master into a branch rather
          # than rebasing it. Make an accidental `git pull` do the same.
          git config --global pull.rebase false

      # A merged or closed pull request means the previous attempt landed or was
      # abandoned. Remove its branch deterministically so the run starts clean,
      # rather than leaving an agent to reason about stale history.
      - name: Drop branch of a merged or closed pull request
        env:
          BRANCH: maintenance/${{ matrix.context }}/${{ matrix.name }}
        run: |
          set -euo pipefail
          state="$(gh pr list --head "$BRANCH" --state all --json state --jq '.[0].state // "none" | ascii_downcase' 2>/dev/null || echo none)"
          if [ "$state" = "merged" ] || [ "$state" = "closed" ]; then
            echo "::notice::PR for $BRANCH is '$state'; removing the stale branch so this run starts clean."
            git push origin --delete "$BRANCH" || true
            git branch -D "$BRANCH" 2>/dev/null || true
            git remote prune origin
          else
            echo "::notice::PR state for $BRANCH is '$state'; keeping the branch."
          fi

      - name: Setup OpenCode auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_API_KEY }}"}}' > ~/.local/share/opencode/auth.json

      # `continue-on-error` lets the publish step below run even when the agent
      # failed, so a rejected push cannot discard the run's verified work.
      - name: Run OpenCode
        id: opencode
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          model: opencode/space-bunny-free
          # Keep the session private: the footer then only links this run,
          # and the session is never published to opencode.ai.
          share: false
          use_github_token: true
          prompt: |
            You are performing the maintenance task in ${{ matrix.context }}: ${{ matrix.name }}

            1. Read instructions/${{ matrix.context }}/maintenance/${{ matrix.name }}.md for specific task instructions.
            2. For version-bump tasks, check instructions/goldstack/version-gating.md to determine if the update is due (skip if version was bumped < 60 days ago).
            3. Follow instructions/goldstack/patching.md to update dependencies and validate.
            4. Follow instructions/goldstack/maintenance.md for committing, pushing, PR management, CI monitoring, and time limits.

            Branch name: maintenance/${{ matrix.context }}/${{ matrix.name }}

      # Deterministic recovery: the agent's own `git push` (and the action's) can
      # be rejected after a rewrite. This republishes the branch under a lease
      # pinned to the tip captured at checkout, so a concurrent push is refused
      # rather than clobbered.
      - name: Publish agent commits
        id: publish
        if: ${{ always() }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/publish-agent-commits.sh

      # Never start this body with `/oc` or `/opencode`: any comment merely
      # containing the mention would re-trigger the opencode workflow.
      - name: Explain republished commits
        if: ${{ steps.publish.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          MODE: ${{ steps.publish.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NUMBER="$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty' || true)"
          if [ -z "$NUMBER" ]; then
            echo "::notice::No pull request to explain the republished commits on."
            exit 0
          fi
          gh issue comment "$NUMBER" --body "The agent run reported a rejected push (\`non-fast-forward\`). Its commits were published to \`$BRANCH\` afterwards using \`$MODE\`, so the branch now holds the agent's final state. Run log: $RUN_URL"

      - name: Fail the run if the agent failed
        if: ${{ steps.opencode.outcome == 'failure' }}
        run: |
          echo "::error::The opencode agent run failed. See the pull request for details."
          exit 1
